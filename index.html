<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ATriangle Solar</title>

  <meta name="description" content="ATriangle Solar Main Portal">
  <meta name="robots" content="noindex, nofollow">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .loading {
      text-align: center;
      color: #0b1f3a;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 0 auto 14px;
      border: 4px solid #e5e7eb;
      border-top-color: #d4a017;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .text {
      font-size: 14px;
      letter-spacing: 0.4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loading">
    <div class="loader"></div>
    <div class="text">Loading ATriangle Solar...</div>
  </div>

  <script>
    const MAIN_PORTAL_URL =
      "https://script.google.com/macros/s/AKfycbzLR3GEnNkgH_y6vevqcxgUdF5ha0tSa0bCBxVJSYBj-Z826b8ROAJKf5Aj4l9vSK4J/exec";

    window.location.replace(MAIN_PORTAL_URL);
  </script>

</body>
</html>
